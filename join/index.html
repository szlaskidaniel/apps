<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open PaceLinkGo</title>
    <meta
      name="description"
      content="Open a PaceLinkGo trip invitation in the app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="site-header">
      <a class="brand" href="/">Developer</a>
    </header>

    <main>
      <section class="hero hero-with-profile">
        <div class="hero-copy">
          <p class="eyebrow">PaceLinkGo</p>
          <h1>Open your trip invitation</h1>
          <p class="lead">
            This invitation is meant to open in PaceLinkGo. If the app is
            installed, return to the invitation link and open it from there.
          </p>
          <p class="lead">
            Don’t have PaceLinkGo yet? Ask the person who sent the invitation
            for help getting started.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
