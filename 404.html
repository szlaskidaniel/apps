<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="site-header">
      <a class="brand" href="/">Developer</a>
    </header>

    <main>
      <section class="hero hero-with-profile">
        <div class="hero-copy">
          <p class="eyebrow" id="page-label">Page not found</p>
          <h1 id="page-title">We couldn’t find that page.</h1>
          <p class="lead" id="page-message">
            The link may be outdated or incomplete.
          </p>
        </div>
      </section>
    </main>

    <script>
      if (window.location.pathname.startsWith('/join/')) {
        document.title = 'Open PaceLinkGo invitation';
        document.getElementById('page-label').textContent = 'PaceLinkGo';
        document.getElementById('page-title').textContent = 'Open your trip invitation';
        document.getElementById('page-message').textContent =
          'This trip invitation is meant to open in PaceLinkGo. If the app is installed, return to the invitation link and open it from there. Otherwise, ask the person who sent it for help getting started.';
      }
    </script>
  </body>
</html>
